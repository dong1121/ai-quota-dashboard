name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-extension:
    name: Verify & Pack Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/pack-extension-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: release/AI-Quota-Chrome-Extension-*.zip

  release-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: verify-and-extension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm run generate-icons --workspace=@ai-quota/desktop

      - name: Package Desktop Installer with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package --workspace=@ai-quota/desktop -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap

  publish-release:
    name: Publish GitHub Release
    needs: [verify-and-extension, release-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p dist-release
          find artifacts -type f -exec cp -v {} dist-release/ \;
          ls -lh dist-release

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist-release/* \
              --repo "${{ github.repository }}" \
              --title "AI 額度儀表板 $TAG" \
              --generate-notes
          fi
