appId: com.dong1121.ai-quota-dashboard
productName: AI Quota Dashboard
electronVersion: "35.7.5"
copyright: Copyright © 2026 dong1121
directories:
  output: ../../release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - "**/node_modules/sql.js/dist/sql-wasm.wasm"
publish:
  - provider: github
    owner: dong1121
    repo: ai-quota-dashboard
    releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI 額度儀表板
portable:
  artifactName: AI-Quota-Dashboard-Portable-${version}-win-x64.exe
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: AI-Quota-Dashboard-${version}-mac-${arch}.${ext}
